name: QUICKCHAT Java Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out QUICKCHAT
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: List project files
        run: |
          ls -la
          ls -la lib

      - name: Compile QUICKCHAT and tests
        run: |
          javac -cp ".:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" Main.java Login.java Message.java Logintest.java MessageTest.java

      - name: Run Login tests
        run: |
          java -cp ".:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" org.junit.runner.JUnitCore logintest

      - name: Run Message tests
        run: |
          java -cp ".:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" org.junit.runner.JUnitCore MessageTest
